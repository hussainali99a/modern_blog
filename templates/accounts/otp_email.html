<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background:#f1f5f9; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;">
    <tr>
      <td align="center">

        <table width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px; background:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#0891b2,#06b6d4); padding:35px 25px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:28px;">
                Modern Blog
              </h1>
              <p style="margin:10px 0 0; color:#ecfeff; font-size:15px;">
                Email Verification
              </p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:35px 30px; text-align:center; color:#0f172a;">

              <h2 style="margin:0 0 12px; font-size:24px;">
                Verify Your Email
              </h2>

              <p style="font-size:15px; color:#475569; line-height:1.6; margin:0 0 25px;">
                Hello {{ user.username }}, use the OTP below to activate your Modern Blog account.
              </p>

              <!-- OTP Box -->
              <div style="display:inline-block; background:#f8fafc; border:2px dashed #06b6d4; border-radius:16px; padding:18px 32px; margin-bottom:25px;">
                <span style="font-size:34px; font-weight:800; letter-spacing:8px; color:#0891b2;">
                  {{ otp }}
                </span>
              </div>

              <p style="font-size:14px; color:#64748b; line-height:1.6;">
                This OTP is valid for a limited time. Do not share this code with anyone.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f8fafc; padding:22px; text-align:center; color:#64748b; font-size:13px;">
              <p style="margin:0 0 8px;">
                Thank you,<br>
                <strong style="color:#0f172a;">Modern Blog Team</strong>
              </p>
              <p style="margin:0;">
                This is an automated email. Please do not reply.
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
