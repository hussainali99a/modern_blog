{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">

    <!-- Profile Card -->
    <div class="glass-panel text-center animate-fadeIn p-5 sm:p-6">

        <img src="{{ profile.profile_pic.url }}"
             class="w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full mx-auto object-cover border-4 border-cyan-400">

        <h2 class="text-xl sm:text-2xl font-bold mt-4 break-words">
            {{ user.username }}
        </h2>

        <p class="text-cyan-400 text-sm sm:text-base">
            {{ profile.profession }}
        </p>

        <p class="text-slate-400 mt-3 text-sm sm:text-base break-words">
            {{ profile.bio }}
        </p>

        <div class="mt-4 text-xs sm:text-sm text-slate-300 break-words">
            📍 {{ profile.location }}
        </div>
    </div>

    <!-- Form Section -->
    <div class="md:col-span-2 glass-panel animate-fadeIn p-5 sm:p-8">

        <h2 class="text-2xl sm:text-3xl font-bold mb-6">
            Maintain Profile
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-5 responsive-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn-primary w-full sm:w-auto">
                Save Profile
            </button>
        </form>

    </div>

</div>
{% endblock %}
