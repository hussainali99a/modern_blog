{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto px-5 grid md:grid-cols-3 gap-8">
    <div class="glass-panel text-center animate-fadeIn">
        <img src="{{ profile.profile_pic.url }}" class="w-32 h-32 rounded-full mx-auto object-cover border-4 border-cyan-400">

        <h2 class="text-2xl font-bold mt-4">{{ user.username }}</h2>
        <p class="text-cyan-400">{{ profile.profession }}</p>
        <p class="text-slate-400 mt-3">{{ profile.bio }}</p>

        <div class="mt-4 text-sm text-slate-300">
            📍 {{ profile.location }}
        </div>
    </div>

    <div class="md:col-span-2 glass-panel animate-fadeIn">
        <h2 class="text-3xl font-bold mb-6">Maintain Profile</h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn-primary">Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
