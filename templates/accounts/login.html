{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-5">
    <div class="glass-panel animate-fadeIn">
        <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
        <p class="text-slate-400 mb-6">Login and continue your conversations.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn-primary w-full">Login</button>
        </form>

        <p class="text-slate-400 mt-5 text-center">
            New here?
            <a href="{% url 'accounts:register' %}" class="text-cyan-400">Create account</a>
        </p>
    </div>
</div>
{% endblock %}
