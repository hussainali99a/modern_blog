{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <div class="glass-panel animate-fadeIn p-5 sm:p-8">

        <h2 class="text-2xl sm:text-3xl font-bold mb-2">
            Create Account
        </h2>

        <p class="text-slate-400 mb-6 text-sm sm:text-base">
            Join the modern communication network.
        </p>

        {% if form.errors %}
            <div class="mb-4 rounded-xl bg-red-500/10 border border-red-400/30 p-4 text-red-300 text-sm">
                {{ form.errors }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-4 responsive-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn-primary w-full">
    Register
</button>
        </form>

        <p class="text-slate-400 mt-5 text-center text-sm sm:text-base">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="text-cyan-400 hover:text-cyan-300">
                Login
            </a>
        </p>

    </div>
</div>
{% endblock %}
