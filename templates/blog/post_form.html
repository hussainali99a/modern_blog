{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-5">
    <div class="glass-panel animate-fadeIn">

        <h1 class="text-4xl font-black mb-6">
            {{ title }}
        </h1>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <!-- TinyMCE media -->
            {{ form.media }}

            <!-- Form -->
            {{ form.as_p }}

            <button class="btn-primary mt-4">
                Save Post
            </button>
        </form>

    </div>
</div>
{% endblock %}
