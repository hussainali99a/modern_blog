{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto px-5">
    <div class="glass-panel text-center animate-fadeIn">
        <h1 class="text-3xl font-bold mb-4">Delete Post?</h1>

        <p class="text-slate-400 mb-6">
            Are you sure you want to delete "{{ post.title }}"?
        </p>

        <form method="POST" class="flex justify-center gap-4">
            {% csrf_token %}
            <button class="btn-danger">Yes, Delete</button>
            <a href="{% url 'blog:post_detail' post.slug %}" class="btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
